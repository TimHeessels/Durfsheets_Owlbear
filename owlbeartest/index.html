<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>DurfSheets Sync</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      margin: 0;
      color: var(--text, inherit);
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 0.75rem;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.35rem 0.5rem;
      color: var(--text, inherit);
      background: var(--paper, transparent);
      border: 1px solid var(--muted, currentColor);
      border-radius: 4px;
    }

    button {
      padding: 0.35rem 0.7rem;
      color: var(--text, inherit);
      background: transparent;
      border: 1px solid var(--muted, currentColor);
      border-radius: 4px;
      cursor: pointer;
    }

    button.primary {
      color: var(--primary-text, inherit);
      background: var(--primary, transparent);
      border-color: var(--primary, currentColor);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #ConfirmPanel {
      padding: 0.6rem;
      margin-bottom: 0.6rem;
      border: 1px solid #e0a030;
      border-radius: 4px;
    }

    #ConfirmPanel p {
      margin: 0 0 0.5rem;
    }

    #SyncedData.error {
      color: #f26d6d;
    }

    #Offline {
      color: #e0a030;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <h1>DurfSheets sync</h1>
  <div id="GMPanel" hidden>
    <div class="row">
      <label for="partyID">Party ID:</label>
      <input type="text" id="partyID" placeholder="Enter party ID" />
      <button id="setPartyID" class="primary">Set Party</button>
    </div>
    <div id="ConfirmPanel" hidden>
      <p id="ConfirmText"></p>
      <div class="row">
        <button id="confirmParty" class="primary">Switch party</button>
        <button id="cancelParty">Cancel</button>
      </div>
    </div>
    <div class="row">
      <input type="checkbox" id="sceneSync" />
      <label for="sceneSync">Sync tokens in this scene</label>
    </div>
    <div class="row">
      <button id="syncNow">Sync now</button>
      <button id="disconnectParty">Disconnect party</button>
    </div>
  </div>
  <p id="SyncedData" role="status">Loading...</p>
  <p id="Offline" hidden>Connection to DurfSheets lost. Reconnecting...</p>
  <script type="module" src="./main.js"></script>
</body>

</html>
